const norm = s => String(s).replace(/\s+/g, '').toLowerCase();
function practiceHTML(u) {
  return u.practice.map((ex, i) => {
    let n = 0;
    const lines = esc(ex.code).split('\n').map((l, k) =>
      `<div class="ln"><span class="n">${k + 1}</span><span>${l.replace(/\{\{(\d+)\}\}/g, (_, g) => `<input class="gap" data-g="${g}" size="${Math.max(3, Math.max(...ex.a[g].map(x => x.length)) + 1)}" aria-label="hueco ${+g + 1}" autocomplete="off" autocapitalize="off" spellcheck="false">`)}</span></div>`).join('');
    return `<div class="ex" data-i="${i}"><div><b>Ejercicio ${i + 1}.</b> ${ex.p}</div><div class="code">${lines}</div><div class="row"><button type="button" class="btn pri sm chk">Comprobar</button><button type="button" class="btn sm hint">Pista</button><button type="button" class="btn sm sol">Ver solución</button><span class="feedback" aria-live="polite"></span></div></div>`;
  }).join('');
}
function bindPractice(root, u) {
  const s = getU(u.id);
  $$('.ex', root).forEach(el => {
    const i = +el.dataset.i, ex = u.practice[i], fb = $('.feedback', el);
    const check = () => {
      let all = true;
      $$('.gap', el).forEach(g => {
        const ok = ex.a[g.dataset.g].some(a => norm(a) === norm(g.value));
        g.classList.toggle('ok', ok); g.classList.toggle('ko', !ok); if (!ok) all = false;
      });
      fb.className = 'feedback ' + (all ? 'ok' : 'ko');
      fb.textContent = all ? '¡Perfecto! Ejercicio superado.' : 'Hay huecos en rojo. Revisa y vuelve a intentarlo.';
      if (all) { s.prac[i] = true; save(); }
    };
    $('.chk', el).addEventListener('click', check);
    $$('.gap', el).forEach(g => g.addEventListener('keydown', e => { if (e.key === 'Enter') check(); }));
    $('.hint', el).addEventListener('click', () => { fb.className = 'feedback'; fb.textContent = 'Pista: ' + ex.h; });
    $('.sol', el).addEventListener('click', () => { $$('.gap', el).forEach(g => { g.value = ex.a[g.dataset.g][0]; g.classList.remove('ko'); }); fb.className = 'feedback'; fb.textContent = 'Solución mostrada. Bórrala mañana e inténtalo de memoria.'; });
    if (s.prac[i]) { $$('.gap', el).forEach(g => { g.value = ex.a[g.dataset.g][0]; g.classList.add('ok'); }); fb.className = 'feedback ok'; fb.textContent = 'Ya superado.'; }
  });
}

function checkHTML(u) {
  const s = getU(u.id);
  return `<div class="check">${u.check.map((c, i) => `<label><input type="checkbox" id="chk-${u.id}-${i}" data-i="${i}" ${s.check[i] ? 'checked' : ''}><span>${c}</span></label>`).join('')}</div>`;
}
function bindCheck(root, u) {
  const s = getU(u.id);
  $$('.check input', root).forEach(c => c.addEventListener('change', () => { s.check[c.dataset.i] = c.checked; save(); }));
}

function block(b, u) {
  switch (b.t) {
    case 'p': return `<p>${b.html}</p>`;
    case 'h4': return `<h3 style="margin-top:6px">${b.html}</h3>`;
    case 'html': return b.html;
    case 'analogy': return `<div class="analogy"><div class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></div><div><b class="t">${b.title}</b>${b.html}</div></div>`;
    case 'steps': return `<ol class="steps">${b.items.map(i => `<li><span>${i}</span></li>`).join('')}</ol>`;
    case 'code': return codeBox(b);
    case 'table': return `<div class="table-wrap"><table><thead><tr>${b.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'mistakes': return `<div class="mistakes">${b.items.map(m => `<div class="mistake"><b>✗ ${m[0]}</b><span>✓ ${m[1]}</span></div>`).join('')}</div>`;
    case 'lab': return `<div class="lab" data-lab="${b.id}"></div>`;
    case 'quiz': return quizHTML(u);
    case 'practice': return practiceHTML(u);
    case 'check': return checkHTML(u);
  }
  return '';
}
const TAGNAME = { lee: 'Lee', mira: 'Mira el código', toca: 'Toca y prueba', comprueba: 'Comprueba' };

function renderUnit(u) {
  const i = UNITS.indexOf(u);
  const prev = i > 0 ? UNITS[i - 1] : null, next = UNITS[i + 1];
  const toc = u.sections.map(s => `<a href="#${u.id}" data-sec="${s.id}">${s.title}</a>`).join(' · ');
  return `<div class="page">
  <header class="unit-head">
    <span class="eyebrow">${u.id === 'kotlin' ? 'Base previa' : 'Unidad ' + u.num} · ${u.short}</span>
    <h1>${u.title}</h1>
    <p class="lead" style="color:var(--muted);font-size:1.08rem;max-width:64ch">${u.intro}</p>
    <div class="unit-meta"><span class="chip">⏱ ${u.minutes} de estudio</span><span class="chip a">${unitPct(u)} % completado</span><span class="chip">${u.quiz.length} preguntas · ${u.practice.length} ejercicios</span></div>
  </header>
  <section class="blk"><div class="blk-head"><h2>Al terminar sabrás</h2></div><ul class="goals">${u.goals.map(g => `<li><span>${g}</span></li>`).join('')}</ul>
  <details class="sol"><summary>Índice de la unidad</summary><div class="prose" style="font-size:.95rem">${toc}</div></details></section>
  ${u.sections.map(s => `<section class="blk" id="${s.id}"><div class="blk-head"><span class="tag t-${s.tag}">${TAGNAME[s.tag]}</span><h2>${s.title}</h2></div>${s.blocks.map(b => block(b, u)).join('')}</section>`).join('')}
  <nav class="nextprev">${prev ? `<a class="btn" href="#${prev.id}">← ${prev.title}</a>` : '<a class="btn" href="#inicio">← Inicio</a>'}${next ? `<a class="btn pri" href="#${next.id}">${next.title} →</a>` : '<a class="btn pri" href="#proyecto">Proyecto final →</a>'}</nav>
  </div>`;
}

  <section class="blk"><div class="blk-head"><h2>Plan de 6 semanas</h2></div>
   <div class="plan">
    <div class="wk"><b>Semana 1</b><span>Kotlin desde cero (variables, control, funciones) + laboratorio "¿Compila?". 4 sesiones.</span></div>
    <div class="wk"><b>Semana 2</b><span>Kotlin (clases, colecciones, nulos) · Ud1: instala Android Studio, crea y ejecuta tu primer proyecto.</span></div>
    <div class="wk"><b>Semana 3</b><span>Ud2 parte 1: @Composable, MainActivity, Text, TextField, Image. Proyecto: pasos 1 y 2.</span></div>
    <div class="wk"><b>Semana 4</b><span>Ud2 parte 2: layouts, modificadores, botones, localización · Ud3: LazyColumn. Proyecto: pasos 3 y 4.</span></div>
    <div class="wk"><b>Semana 5</b><span>Ud3: grids y temas · Ud4: ciclo de vida, ViewModel. Proyecto: paso 5.</span></div>
    <div class="wk"><b>Semana 6</b><span>Repaso: <a href="#chuleta">chuleta</a>, <a href="#flashcards">tarjetas</a> y 3 <a href="#examen">simulacros de examen</a>. Repite las unidades con menos del 70 %.</span></div>
   </div>
  </section>
  <section class="blk"><div class="blk-head"><h2>Herramientas de repaso</h2></div>
   <div class="cards">
    <a class="ucard" href="#flashcards"><h3>Tarjetas de memoria</h3><p>${GLOSS.length} conceptos clave para darle la vuelta y repasar.</p></a>
    <a class="ucard" href="#examen"><h3>Simulacro de examen</h3><p>15 preguntas al azar de todas las unidades, con nota por unidad.</p></a>
    <a class="ucard" href="#chuleta"><h3>Chuleta</h3><p>Todo el código esencial del módulo en una página.</p></a>
   </div>
  </section>
  </div>`;
}

function projPct() { const s = P.proyecto || {}; return Math.round(PROJECT.filter((_, i) => s[i]).length / PROJECT.length * 100); }
function renderProject() {
  const s = P.proyecto = P.proyecto || {};
  return `<div class="page"><header class="unit-head"><span class="eyebrow">Proyecto integrador</span><h1>Mi lista de la compra</h1>
  <p style="color:var(--muted);font-size:1.08rem;max-width:64ch">Una app pequeña pero completa que usa <b>todas</b> las unidades. Hazla en Android Studio, paso a paso. Intenta cada paso tú solo; abre la solución solo si llevas 20 minutos atascado.</p>
  <div class="unit-meta"><span class="chip a">${projPct()} % completado</span></div></header>
  ${PROJECT.map((p, i) => { const u = UNITS.find(x => x.id === p.u); return `<section class="blk"><div class="blk-head"><span class="tag t-toca">Paso ${i + 1} · ${u.id === 'kotlin' ? 'Kotlin' : 'Ud' + u.num}</span><h2>${p.t}</h2></div><p class="prose">${p.d}</p>
  ${p.code ? `<details class="sol"><summary>Ver una solución posible</summary><div>${codeBox({ file: 'Solución', lines: p.code.split('\n').map(l => [l, '']) })}</div></details>` : ''}
  <div class="check"><label><input type="checkbox" id="pj-${i}" data-i="${i}" ${s[i] ? 'checked' : ''}><span>Hecho y funcionando en el emulador</span></label></div></section>`; }).join('')}
  <section class="blk"><div class="blk-head"><h2>Retos extra</h2></div><ul class="goals"><li><span>Añade un botón para borrar un producto (pista: <code>actual.productos - producto</code>).</span></li><li><span>Muestra la lista en una cuadrícula con <code>GridCells.Adaptive</code> en tablets.</span></li><li><span>Añade un contador de productos en la topBar del Scaffold.</span></li><li><span>Pon un <code>Log.d</code> en cada callback del ciclo de vida y comprueba el orden al girar.</span></li></ul></section>
  </div>`;
}

let fc = { i: 0, f: 'all', order: [] };
function renderFlash() {
  return `<div class="page"><header class="unit-head"><span class="eyebrow">Repaso</span><h1>Tarjetas de memoria</h1><p style="color:var(--muted)">Lee el concepto, intenta explicarlo en voz alta y pulsa la tarjeta para comprobarlo.</p></header>
  <div class="toolbar"><label for="fc-f" class="eyebrow">Unidad</label><select id="fc-f"><option value="all">Todas</option>${UNITS.map(u => `<option value="${u.id}">${u.title}</option>`).join('')}</select><button type="button" class="btn sm" id="fc-sh">Barajar</button><span class="score" id="fc-n"></span></div>
  <div class="fc-wrap"><button type="button" class="fc" id="fc"><div class="fc-in"><div class="fc-f"><span class="eyebrow" id="fc-u"></span><b id="fc-t"></b><span class="score">Pulsa para dar la vuelta</span></div><div class="fc-b" id="fc-d"></div></div></button>
  <div class="row"><button type="button" class="btn" id="fc-p">← Anterior</button><button type="button" class="btn pri" id="fc-nx">Siguiente →</button></div></div></div>`;
}
function bindFlash() {
  const pool = () => GLOSS.map((g, i) => i).filter(i => fc.f === 'all' || GLOSS[i][2] === fc.f);
  const show = () => {
    const ord = fc.order; if (!ord.length) return;
    const g = GLOSS[ord[fc.i]];
    $('#fc').classList.remove('flip'); $('#fc-t').textContent = g[0]; $('#fc-d').textContent = g[1];
    const u = UNITS.find(x => x.id === g[2]); $('#fc-u').textContent = u.title; $('#fc-n').textContent = `${fc.i + 1} / ${ord.length}`;
  };
  fc.order = pool(); fc.i = 0; $('#fc-f').value = fc.f;
  $('#fc').addEventListener('click', () => $('#fc').classList.toggle('flip'));
  $('#fc-nx').addEventListener('click', () => { fc.i = (fc.i + 1) % fc.order.length; show(); });
  $('#fc-p').addEventListener('click', () => { fc.i = (fc.i - 1 + fc.order.length) % fc.order.length; show(); });
  $('#fc-f').addEventListener('change', e => { fc.f = e.target.value; fc.order = pool(); fc.i = 0; show(); });
  $('#fc-sh').addEventListener('click', () => { fc.order.sort(() => Math.random() - .5); fc.i = 0; show(); });
  show();
}

let exam = null;
function newExam() {
  const bank = []; UNITS.forEach(u => u.quiz.forEach((q, i) => bank.push({ u: u.id, q })));
  bank.sort(() => Math.random() - .5);
  // al menos 2 por unidad
  const pick = []; UNITS.forEach(u => pick.push(...bank.filter(b => b.u === u.id).slice(0, 2)));
  bank.forEach(b => { if (pick.length < 15 && !pick.includes(b)) pick.push(b); });
  exam = { items: pick.sort(() => Math.random() - .5), ans: {}, done: false };
}
function renderExam() {
  if (!exam) newExam();
  const best = P.examBest;
  return `<div class="page"><header class="unit-head"><span class="eyebrow">Simulacro</span><h1>Examen tipo test</h1><p style="color:var(--muted)">15 preguntas al azar de todas las unidades. Respóndelas todas y pulsa <b>Corregir</b>. Objetivo: 8 o más.${best != null ? ` Tu mejor nota: <b>${best}/10</b>.` : ''}</p></header>
  <div class="quiz" id="ex">${exam.items.map((it, i) => `<div class="q" data-i="${i}"><div class="qt">${i + 1}. ${it.q.q} <span class="chip">${UNITS.find(u => u.id === it.u).title}</span></div><div class="opts">${it.q.o.map((o, j) => `<button type="button" class="opt" data-j="${j}"><span class="l">${'ABCD'[j]}</span><span>${o}</span></button>`).join('')}</div><div class="why" hidden></div></div>`).join('')}</div>
  <div class="row"><button type="button" class="btn pri" id="ex-c">Corregir</button><button type="button" class="btn" id="ex-n">Nuevo examen</button><span class="score" id="ex-s"></span></div>
  <div id="ex-r"></div></div>`;
}
function bindExam() {
  const cnt = () => $('#ex-s').textContent = `${Object.keys(exam.ans).length} / 15 respondidas`;
  $$('#ex .q').forEach(q => { const i = +q.dataset.i; $$('.opt', q).forEach(b => b.addEventListener('click', () => { if (exam.done) return; exam.ans[i] = +b.dataset.j; $$('.opt', q).forEach(x => x.setAttribute('aria-pressed', x === b)); $$('.opt', q).forEach(x => x.style.borderColor = x === b ? 'var(--ink)' : ''); cnt(); })); });
  $('#ex-n').addEventListener('click', () => { newExam(); render(); scrollTo(0, 0); });
  $('#ex-c').addEventListener('click', () => {
    exam.done = true; let ok = 0; const per = {};
    exam.items.forEach((it, i) => {
      const q = $(`#ex .q[data-i="${i}"]`), j = exam.ans[i], right = j === it.q.a; if (right) ok++;
      per[it.u] = per[it.u] || [0, 0]; per[it.u][1]++; if (right) per[it.u][0]++;
      $$('.opt', q).forEach((b, k) => { b.disabled = true; b.style.borderColor = ''; if (k === it.q.a) b.classList.add('right'); if (k === j && !right) b.classList.add('wrong'); });
      const w = $('.why', q); w.hidden = false; w.innerHTML = (right ? '<b class="ok">Correcto.</b> ' : j === undefined ? '<b class="ko">Sin responder.</b> ' : '<b class="ko">Incorrecto.</b> ') + it.q.w;
    });
    const nota = Math.round(ok / 15 * 100) / 10; P.examBest = Math.max(P.examBest || 0, nota); save();
    const weak = Object.entries(per).filter(([, v]) => v[0] / v[1] < .7).map(([k]) => UNITS.find(u => u.id === k));
    $('#ex-r').innerHTML = `<div class="result"><h2>Nota: ${nota.toLocaleString('es-ES')} / 10</h2><p>${nota >= 8 ? 'Muy bien. Estás preparado para esta parte del examen.' : nota >= 5 ? 'Aprobado, pero repasa las unidades marcadas abajo.' : 'Todavía no. Repasa las unidades marcadas y vuelve a intentarlo mañana.'}</p>
    <div class="bars">${Object.entries(per).map(([k, v]) => `<div class="br"><span>${UNITS.find(u => u.id === k).title}</span><div class="meter"><i style="width:${v[0] / v[1] * 100}%;${v[0] / v[1] < .7 ? 'background:var(--warn)' : ''}"></i></div><em>${v[0]}/${v[1]}</em></div>`).join('')}</div>
    ${weak.length ? `<p>Repasa: ${weak.map(u => `<a href="#${u.id}">${u.title}</a>`).join(', ')}.</p>` : ''}</div>`;
    $('#ex-r').scrollIntoView({ behavior: 'smooth' });
  });
  cnt();
}

function renderCheat() {
  const C = [
   ['Kotlin: lo básico', 'val fijo = 1        // no cambia\nvar cambia = 2      // sí cambia\n"Hola $nombre ${a + b}"\nval r = if (x > 0) "pos" else "neg"\nwhen (n) { 1 -> "a"; in 2..5 -> "b"; else -> "c" }\nfor (i in 1..10 step 2) {}\nfor (i in 10 downTo 1) {}\nfun suma(a: Int, b: Int = 0): Int = a + b\nval doble: (Int) -> Int = { it * 2 }'],
   ['Kotlin: clases y nulos', 'open class A(val x: Int) { open fun f() {} }\nclass B(x: Int) : A(x) { override fun f() {} }\ndata class P(val n: String, val e: Int)\nenum class Color { ROJO, VERDE }\nobject Config { val v = 1 }\nval s: String? = null\ns?.length ?: 0      // llamada segura + Elvis\ns!!.length          // ¡peligro! NPE'],
   ['Colecciones', 'listOf(1, 2)          // solo lectura\nmutableListOf(1)      // add, remove, [i] =\nsetOf("a")            // sin duplicados, "a" in s\nmutableMapOf("k" to 1) // m["k"], m["z"] = 2\narrayOf(1, 2, 3)'],
   ['Manifest (Ud1)', '<activity android:name=".MainActivity"\n    android:exported="true">\n  <intent-filter>\n    <action android:name="android.intent.action.MAIN"/>\n    <category android:name="android.intent.category.LAUNCHER"/>\n  </intent-filter>\n</activity>'],
   ['Log (Ud1)', 'Log.e(TAG, "error")\nLog.w(TAG, "aviso")\nLog.i(TAG, "info")\nLog.d(TAG, "depuración")\nLog.v(TAG, "detalle")\n// E > W > I > D > V'],
   ['Composable y texto (Ud2)', '@Composable\nfun Tarjeta(modifier: Modifier = Modifier) {\n  Text(\n    text = stringResource(R.string.hola),\n    fontSize = 20.sp,\n    fontWeight = FontWeight.Bold,\n    textAlign = TextAlign.Start,\n    color = MaterialTheme.colorScheme.primary,\n    modifier = modifier\n  )\n}'],
   ['Estado, TextField y botón (Ud2)', 'var t by remember { mutableStateOf("") }\nTextField(value = t, onValueChange = { t = it },\n  label = { Text(stringResource(R.string.x)) })\nButton(onClick = { /* acción */ }) {\n  Text(stringResource(R.string.ok))\n}'],
   ['Imagen y layouts (Ud2)', 'Image(painter = painterResource(R.drawable.img),\n  contentDescription = null, alpha = 0.5f)\nColumn(verticalArrangement = Arrangement.Center,\n  horizontalAlignment = Alignment.CenterHorizontally) {}\nRow(horizontalArrangement = Arrangement.SpaceBetween,\n  verticalAlignment = Alignment.CenterVertically) {}\nBox(contentAlignment = Alignment.Center) {}'],
   ['Listas y grids (Ud3)', 'data class Item(@StringRes val t: Int,\n  @DrawableRes val img: Int)\nLazyColumn { items(lista) { it -> Tarjeta(it) } }\nLazyVerticalGrid(\n  columns = GridCells.Fixed(2)          // o\n  // columns = GridCells.Adaptive(128.dp)\n) { items(lista) { Tarjeta(it) } }'],
   ['Ciclo de vida (Ud4)', 'Abrir:  onCreate → onStart → onResume\nInicio: onPause → onStop\nVolver: onRestart → onStart → onResume\nGirar:  onPause → onStop → onDestroy →\n        onCreate → onStart → onResume\nAtrás:  onPause → onStop → onDestroy'],
   ['ViewModel (Ud4)', 'class MiVM : ViewModel() {\n  private val _ui = MutableStateFlow(UiState())\n  val ui: StateFlow<UiState> = _ui.asStateFlow()\n  fun cambiar(v: String) {\n    _ui.update { it.copy(campo = v) }\n  }\n}\n// en la pantalla:\nvm: MiVM = viewModel()\nval ui by vm.ui.collectAsState()'],
   ['Recursos', 'res/values/strings.xml     textos (por defecto)\nres/values-es/strings.xml  textos en español\nres/drawable               imágenes\nres/mipmap                 iconos\nres/font                   fuentes\nui.theme/Theme.kt          tema'],
  ];
  return `<div class="page"><header class="unit-head"><span class="eyebrow">Repaso rápido</span><h1>Chuleta del módulo</h1><p style="color:var(--muted)">Todo el código esencial en una página. Úsala para repasar, no para estudiar desde cero.</p></header><div class="cheat">${C.map(c => `<div class="cc"><h3>${c[0]}</h3><pre>${c[1].split('\n').map(l => hl(l, c[0].startsWith('Manifest') ? 'xml' : '')).join('\n')}</pre></div>`).join('')}</div></div>`;
}

/* ---------- Navegación ---------- */
const ROUTES = [{ id: 'inicio', t: 'Inicio', s: 'Cómo usar la guía' }, ...UNITS.map(u => ({ id: u.id, t: u.title, s: u.id === 'kotlin' ? 'Base' : 'Unidad ' + u.num, u })), { id: 'proyecto', t: 'Proyecto final', s: 'Aplica todo' }, { id: 'flashcards', t: 'Tarjetas', s: 'Repaso' }, { id: 'examen', t: 'Simulacro', s: 'Repaso' }, { id: 'chuleta', t: 'Chuleta', s: 'Repaso' }];
function ring(p) { const c = 2 * Math.PI * 13; return `<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="${c * p / 100} ${c}"/></svg>`; }
function nav() {
  const cur = location.hash.slice(1) || 'inicio';
  $('#route').innerHTML = ROUTES.map((r, i) => {
    const p = r.u ? unitPct(r.u) : r.id === 'proyecto' ? projPct() : null;
    const label = r.id === 'inicio' ? '⌂' : r.u ? (r.u.id === 'kotlin' ? 'K' : r.u.num) : r.id === 'proyecto' ? '★' : '·';
    const sep = r.id === 'flashcards' ? '<div class="eyebrow route-title">Herramientas</div>' : '';
    return `${sep}<a class="stop${cur === r.id ? ' active' : ''}${p >= 100 ? ' done' : ''}" href="#${r.id}"><span class="dot">${p != null && p > 0 && p < 100 ? ring(p) : ''}${label}</span><span class="lbl">${r.t}<small>${r.s}${p != null ? ' · ' + p + ' %' : ''}</small></span></a>`;
  }).join('');
  $('#mnav').innerHTML = ROUTES.map(r => `<option value="${r.id}" ${cur === r.id ? 'selected' : ''}>${r.u ? (r.u.id === 'kotlin' ? 'Base · ' : 'Ud' + r.u.num + ' · ') : ''}${r.t}</option>`).join('');
}
function updateProgress() {
  const all = (UNITS.reduce((a, u) => a + unitPct(u), 0) + projPct()) / (UNITS.length + 1);
  $('#gbar').style.width = all + '%'; $('#gtxt').textContent = Math.round(all) + ' % del módulo';
  nav();
}
function render() {
  const id = location.hash.slice(1) || 'inicio';
  const u = UNITS.find(x => x.id === id);
  const main = $('#view');
  if (u) main.innerHTML = renderUnit(u);
  else if (id === 'proyecto') main.innerHTML = renderProject();
  else if (id === 'flashcards') main.innerHTML = renderFlash();
  else if (id === 'examen') main.innerHTML = renderExam();
  else if (id === 'chuleta') main.innerHTML = renderCheat();
  else main.innerHTML = renderHome();
  $$('.lab', main).forEach(l => LABS[l.dataset.lab] && LABS[l.dataset.lab](l));
  if (u) { bindQuiz(main, u); bindPractice(main, u); bindCheck(main, u); $$('[data-sec]', main).forEach(a => a.addEventListener('click', e => { e.preventDefault(); document.getElementById(a.dataset.sec).scrollIntoView({ behavior: 'smooth' }); })); }
  if (id === 'proyecto') $$('.check input', main).forEach(c => c.addEventListener('change', () => { P.proyecto[c.dataset.i] = c.checked; save(); $('.unit-meta .chip', main).textContent = projPct() + ' % completado'; }));
  if (id === 'flashcards') bindFlash();
  if (id === 'examen') bindExam();
  updateProgress();
}
let lastId = null;
window.addEventListener('hashchange', () => { const id = location.hash.slice(1) || 'inicio'; if (id !== lastId) { lastId = id; render(); scrollTo(0, 0); } });
$('#mnav').addEventListener('change', e => { location.hash = e.target.value; });
$('#reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (b.dataset.armed) { P = {}; save(); exam = null; render(); b.textContent = 'Borrar mi progreso'; delete b.dataset.armed; }
  else { b.dataset.armed = 1; b.textContent = 'Pulsa otra vez para confirmar'; setTimeout(() => { b.textContent = 'Borrar mi progreso'; delete b.dataset.armed; }, 3000); }
});
lastId = location.hash.slice(1) || 'inicio';
render();
</script>

<title>Ruta Android PMDM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sidebar "ruta" de estaciones a la izquierda + cuaderno de trabajo central; en móvil la ruta se pliega arriba */
:root{
  --bg:#F4F7F4; --surface:#FFFFFF; --sunk:#EAF0EB; --ink:#17201B; --muted:#56655C; --line:#D5DED7;
  --accent:#1D7348; --accent-ink:#FFFFFF; --accent-soft:#DDF0E5;
  --kotlin:#6A4BD6; --kotlin-soft:#ECE8FC;
  --warn:#A64A12; --warn-soft:#FBEADF; --bad:#B3261E; --bad-soft:#FBE4E2; --ok:#1D7348; --ok-soft:#DDF0E5;
  --code-bg:#151A17; --code-fg:#E3EBE5; --code-dim:#7D8C83; --code-kw:#C6A6FF; --code-str:#9BE0A8; --code-num:#F2B676; --code-ann:#F28FB5; --code-type:#7FD3E6; --code-hl:#24332A;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,40,28,.06), 0 4px 14px rgba(20,40,28,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#161D19; --sunk:#1B2420; --ink:#E2EBE5; --muted:#9AAAA0; --line:#2A362F;
  --accent:#55CF8D; --accent-ink:#0B1A11; --accent-soft:#17301F;
  --kotlin:#AE9BFF; --kotlin-soft:#231E3B;
  --warn:#F2A774; --warn-soft:#352216; --bad:#FF8E85; --bad-soft:#3A1C1A; --ok:#55CF8D; --ok-soft:#17301F;
  --code-bg:#0A0D0B; --code-hl:#1C2A21; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#161D19; --sunk:#1B2420; --ink:#E2EBE5; --muted:#9AAAA0; --line:#2A362F;
  --accent:#55CF8D; --accent-ink:#0B1A11; --accent-soft:#17301F;
  --kotlin:#AE9BFF; --kotlin-soft:#231E3B;
  --warn:#F2A774; --warn-soft:#352216; --bad:#FF8E85; --bad-soft:#3A1C1A; --ok:#55CF8D; --ok-soft:#17301F;
  --code-bg:#0A0D0B; --code-hl:#1C2A21; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.6vw,3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.65rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
code,kbd{overflow-wrap:anywhere;font-family:var(--f-code);font-size:.86em;background:var(--sunk);border:1px solid var(--line);padding:.05em .35em;border-radius:5px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--kotlin);outline-offset:2px}
.eyebrow{font-family:var(--f-code);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:22px 16px 30px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center}
.brand .logo{width:38px;height:38px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:1.05rem;line-height:1.1;display:block}
.brand span{font-size:.78rem;color:var(--muted)}
.route{display:flex;flex-direction:column;gap:2px;position:relative}
.route-title{margin:6px 0 4px}
.stop{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);border:1px solid transparent}
.stop:hover{background:var(--sunk)}
.stop.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.stop .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-code);font-size:.72rem;font-weight:600;background:var(--surface);position:relative}
.stop .dot svg{position:absolute;inset:-2px;transform:rotate(-90deg)}
.stop .lbl{font-size:.92rem;line-height:1.25}
.stop .lbl small{display:block;color:var(--muted);font-size:.76rem}
.stop.done .dot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.8rem;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}

.main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.mobile-nav{display:none}

.hero{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.hero .lead{font-size:1.12rem;color:var(--muted);max-width:62ch}
.unit-head{display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);padding-bottom:22px}
.unit-meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.chip.k{background:var(--kotlin-soft);color:var(--kotlin);border-color:transparent}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.goals{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.goals li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.goals li::before{content:"→";color:var(--accent);font-weight:700}

section.blk{display:flex;flex-direction:column;gap:14px;scroll-margin-top:20px}
.blk-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.blk-head .tag{font-family:var(--f-code);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.t-lee{background:var(--sunk)} .tag.t-mira{background:var(--kotlin-soft);color:var(--kotlin)} .tag.t-toca{background:var(--accent-soft);color:var(--accent)} .tag.t-comprueba{background:var(--warn-soft);color:var(--warn)}
.prose{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}

.analogy{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 18px;border-radius:var(--r);background:var(--kotlin-soft);color:var(--ink)}
.analogy .ico{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--kotlin)}
.analogy b.t{display:block;font-family:var(--f-display);color:var(--kotlin);margin-bottom:2px}

.steps{counter-reset:s;display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-code);font-size:.8rem;font-weight:600}

.mistakes{display:grid;gap:10px}
.mistake{display:grid;grid-template-columns:1fr;gap:4px;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);border-left:0}
.mistake b{color:var(--warn)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-size:.85rem;background:var(--sunk)}
tr:last-child td{border-bottom:0}

/* Código explicado */
.codebox{border-radius:var(--r);overflow:hidden;background:var(--code-bg);color:var(--code-fg);box-shadow:var(--shadow)}
.codebar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;font-family:var(--f-code);font-size:.76rem;color:var(--code-dim);border-bottom:1px solid #26302a;flex-wrap:wrap}
.codebar .hint{color:var(--code-dim)}
.codebar button{background:#26302a;border:0;color:var(--code-fg);padding:3px 9px;border-radius:5px;font-size:.74rem;font-family:var(--f-code)}
.code{overflow-x:auto;padding:8px 0;font-family:var(--f-code);font-size:.84rem;line-height:1.65}
.code .ln{display:grid;grid-template-columns:34px 1fr;padding-right:14px;white-space:pre;min-width:max-content}
.code .ln .n{color:#4c5a51;text-align:right;padding-right:12px;user-select:none}
.code .ln.x{cursor:pointer}
.code .ln.x .n{color:var(--code-num)}
.code .ln.x:hover{background:var(--code-hl)}
.code .ln.sel{background:var(--code-hl);box-shadow:inset 3px 0 0 var(--code-num)}
.k-kw{color:var(--code-kw)} .k-str{color:var(--code-str)} .k-num{color:var(--code-num)} .k-com{color:var(--code-dim);font-style:italic} .k-ann{color:var(--code-ann)} .k-type{color:var(--code-type)} .k-tag{color:var(--code-kw)}
.explain{padding:12px 16px;border-top:1px solid #26302a;background:#1d2520;color:var(--code-fg);font-family:var(--f-body);font-size:.95rem;min-height:48px}
.explain b{color:var(--code-num);font-family:var(--f-code);font-size:.8rem;margin-right:6px}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.q .qt{font-weight:700}
.q .qt code{font-weight:400}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .l{font-family:var(--f-code);font-size:.8rem;color:var(--muted);padding-top:2px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.why{padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:.94rem}
.why b.ok{color:var(--ok)} .why b.ko{color:var(--bad)}
.score{font-family:var(--f-code);font-size:.85rem;color:var(--muted)}

/* Práctica */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.ex .code{background:var(--code-bg);color:var(--code-fg);border-radius:8px}
.gap{font-family:var(--f-code);font-size:.84rem;background:#26302a;color:#fff;border:1px dashed var(--code-num);border-radius:4px;padding:0 4px;min-width:3ch}
.gap.ok{border:1px solid var(--code-str);background:#1f3a28}
.gap.ko{border:1px solid #ff8e85;background:#3a1c1a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{text-decoration:none;display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.feedback{font-size:.92rem}
.feedback.ok{color:var(--ok)} .feedback.ko{color:var(--bad)}

/* Checklist */
.check{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.check label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;cursor:pointer;padding:4px 0}
.check input{width:18px;height:18px;margin-top:4px;accent-color:var(--accent)}

/* Labs */
.lab{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.lab-title{display:flex;gap:10px;align-items:center}
.lab-title .badge{font-family:var(--f-code);font-size:.7rem;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:5px;letter-spacing:.05em}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl label.f{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--muted)}
select{width:100%}
select,input[type=text],input[type=number]{font:inherit;font-size:.95rem;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
input[type=range]{accent-color:var(--accent);width:100%}
.phone{width:min(240px,100%);aspect-ratio:9/16;max-width:100%;margin:0 auto;border-radius:26px;border:8px solid var(--ink);background:var(--bg);position:relative;overflow:hidden}
.phone .scr{position:absolute;inset:0;display:flex;padding:10px}
.blkA,.blkB,.blkC{border-radius:6px;display:grid;place-items:center;font-family:var(--f-code);font-weight:600;color:#fff;font-size:.8rem}
.blkA{background:#1D7348;width:62px;height:62px}.blkB{background:#6A4BD6;width:48px;height:48px}.blkC{background:#C2571A;width:34px;height:34px}
.log{font-family:var(--f-code);font-size:.8rem;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.log .e{color:#ff8e85}.log .w{color:#f2c46d}.log .i{color:#9be0a8}.log .d{color:#7fd3e6}.log .v{color:#b8c4bd}
.log .cb{color:var(--code-num)} .log .sys{color:var(--code-dim)}
.states{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.state{padding:5px 10px;border-radius:99px;border:1px solid var(--line);font-size:.8rem;font-family:var(--f-code);color:var(--muted);background:var(--bg);transition:all .2s}
.state.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);transform:scale(1.06)}
.arrow{color:var(--muted);font-size:.8rem}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.tree{font-family:var(--f-code);font-size:.84rem;display:flex;flex-direction:column}
.tree button{text-align:left;background:none;border:0;padding:3px 6px;border-radius:5px;white-space:nowrap}
.tree button:hover{background:var(--sunk)}
.tree button.sel{background:var(--accent-soft);color:var(--accent)}
.tree .dir{color:var(--muted);padding:3px 6px}
.infobox{padding:14px;border-radius:10px;background:var(--sunk);font-size:.95rem;min-height:120px}
.stack{display:flex;flex-direction:column-reverse;gap:6px;min-height:200px;justify-content:flex-start;padding:10px;border-radius:10px;background:var(--sunk)}
.layer{padding:10px;border-radius:8px;text-align:center;font-weight:700;color:#fff}
.flow{display:flex;flex-direction:column;gap:6px}
.flow .fs{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:.9rem;transition:all .25s;background:var(--bg)}
.flow .fs.on{background:var(--accent-soft);border-color:var(--accent)}
.flow .fs i{font-style:normal;font-family:var(--f-code);font-size:.78rem;color:var(--muted)}
.lazybox{height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;position:relative;background:var(--bg)}
.lazyitem{position:absolute;left:0;right:0;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);font-size:.88rem}
.lazyitem .fl{width:26px;height:18px;border-radius:3px}
.gridstage{overflow-x:auto;padding:8px;background:var(--sunk);border-radius:8px}
.gridframe{border:6px solid var(--ink);border-radius:14px;padding:8px;background:var(--bg);display:grid;gap:6px;transition:width .2s}
.gridframe div{aspect-ratio:1;border-radius:6px;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--f-code);font-size:.75rem;color:var(--accent)}
.modi{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.modi .card{display:flex;flex-direction:column;gap:8px}
.padzone{background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 6px,var(--surface) 6px,var(--surface) 12px);border:1px dashed var(--muted);border-radius:8px;position:relative;cursor:default}
.padzone .inner{background:var(--accent-soft);border-radius:6px;padding:14px;text-align:center;font-weight:700;color:var(--accent)}
.clickable{cursor:pointer;transition:box-shadow .15s}
.clickable:hover{box-shadow:0 0 0 3px var(--kotlin) inset}
.flash{animation:fl .5s}
@keyframes fl{0%{background-color:var(--kotlin-soft)}100%{}}
.verdict{display:flex;gap:8px}

/* Inicio */
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.method div{padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.method b{font-family:var(--f-display)}
.method span{font-size:.88rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ucard{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.ucard:hover{border-color:var(--accent)}
.ucard .top{display:flex;justify-content:space-between;align-items:center}
.ucard .num{font-family:var(--f-code);font-size:.78rem;color:var(--muted)}
.ucard p{font-size:.9rem;color:var(--muted)}
.plan{display:grid;gap:8px}
.plan .wk{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.plan .wk b{font-family:var(--f-display)}
.plan .wk span{font-size:.92rem}

/* Flashcards */
.fc-wrap{display:flex;flex-direction:column;gap:14px;align-items:center}
.fc{width:min(520px,100%);min-height:240px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0}
.fc-in{position:relative;width:100%;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;border:1px solid var(--line)}
.fc-f{background:var(--surface)}
.fc-f b{font-family:var(--f-display);font-size:1.7rem}
.fc-b{background:var(--accent-soft);transform:rotateY(180deg);font-size:1.02rem}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}*{animation:none!important;transition:none!important}}

.toolbar select{width:auto;flex:1;min-width:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.result{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.bars{display:grid;gap:6px}
.bars .br{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:.88rem}
.bars .br .meter{height:10px}
.bars .br em{font-style:normal;font-family:var(--f-code);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
details.sol{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.sol summary{cursor:pointer;padding:10px 14px;font-weight:700}

<script>
/* ====== CONTENIDO DE LA GUÍA ====== */
const UNITS = [
/* ---------------------------------------------------------------- KOTLIN */
{
 id:'kotlin', num:'0', title:'Kotlin desde cero', short:'El idioma de Android', minutes:'6–8 h', color:'k',
 intro:'Antes de hablar con Android necesitas su idioma. Kotlin es el lenguaje oficial de Android (junto con Java). Si ya sabes algo de Java, verás que Kotlin es lo mismo pero escribiendo menos.',
 goals:['Declarar variables con <code>val</code> y <code>var</code> y saber cuándo usar cada una.','Escribir <code>if</code>, <code>when</code> y bucles <code>for</code> con rangos.','Crear funciones, con parámetros por defecto y lambdas.','Crear clases, <code>data class</code>, <code>enum</code> y <code>object</code>.','Usar listas, conjuntos y mapas.','Evitar errores con <code>null</code> usando <code>?</code>, <code>?.</code> y <code>?:</code>.'],
 sections:[
  {id:'k-var', tag:'lee', title:'1. Variables: val y var', blocks:[
    {t:'analogy', title:'Piensa en cajas con etiqueta', html:'Una variable es una caja con un nombre. <b>val</b> es una caja <b>sellada</b>: guardas algo una vez y ya no puedes cambiarlo. <b>var</b> es una caja <b>abierta</b>: puedes sacar lo que hay y meter otra cosa. Regla práctica: usa <code>val</code> siempre, y cambia a <code>var</code> solo si el valor de verdad tiene que cambiar.'},
    {t:'code', file:'Variables.kt', lines:[
      ['val nombre = "Ana"','<b>val</b> = solo lectura. No escribimos el tipo: Kotlin ve las comillas y deduce que es <code>String</code>. Esto se llama <b>inferencia de tipo</b>.'],
      ['var edad: Int = 17','<b>var</b> = mutable, puede cambiar. Aquí sí escribimos el tipo (<code>: Int</code>). Es opcional cuando Kotlin puede deducirlo.'],
      ['edad = 18','Correcto: <code>edad</code> es <code>var</code>, así que podemos darle otro valor.'],
      ['// nombre = "Luis"   ← ERROR: val no se puede reasignar','Si quitas las // esto no compila. Un <code>val</code> no admite un segundo valor.'],
      ['println("Hola, $nombre. Tienes $edad años")','Plantillas de texto: <code>$variable</code> mete el valor dentro del String. También vale <code>"Hola, " + nombre</code>, pero <code>$</code> es más cómodo.'],
      ['println("El año que viene: ${edad + 1}")','Si dentro hay una <b>operación</b>, usa llaves: <code>${...}</code>.']
    ]},
    {t:'table', head:['Tipo','Ejemplo','Para qué'], rows:[['Int','<code>val n = 5</code>','Números enteros'],['Double','<code>val p = 9.99</code>','Números con decimales'],['Float','<code>val a = 0.5f</code>','Decimales "cortos" (la f al final). Se usa en Compose, p. ej. <code>alpha = 0.5f</code>'],['Boolean','<code>val ok = true</code>','Sí / no'],['String','<code>val s = "Hola"</code>','Texto'],['Char','<code>val c = \'k\'</code>','Un solo carácter']]}
  ]},
  {id:'k-ctrl', tag:'lee', title:'2. Estructuras de control', blocks:[
    {t:'p', html:'Son casi iguales que en Java, con tres diferencias que caen en examen: el <code>if</code> puede <b>devolver un valor</b>, el <code>switch</code> se llama <code>when</code>, y el <code>for</code> funciona como un <i>foreach</i> con rangos.'},
    {t:'code', file:'Control.kt', lines:[
      ['val nota = 7',''],
      ['val resultado = if (nota >= 5) "Aprobado" else "Suspenso"','El <code>if</code> como <b>expresión</b>: su resultado se guarda directamente en una variable. En Java necesitarías el operador <code>? :</code>.'],
      ['',''],
      ['val texto = when (nota) {','<b>when</b> sustituye a <code>switch</code>. Compara <code>nota</code> con cada caso de arriba abajo.'],
      ['    10 -> "Matrícula"','Si <code>nota</code> vale 10 → "Matrícula". La flecha <code>-></code> separa el caso del resultado.'],
      ['    in 7..9 -> "Notable"','<code>in 7..9</code> significa "está entre 7 y 9, ambos incluidos".'],
      ['    in 5..6 -> "Aprobado"',''],
      ['    else -> "Suspenso"','Como el <code>when</code> <b>devuelve</b> un valor, el <code>else</code> es <b>obligatorio</b> (o cubrir todos los casos). Sin él, no compila.'],
      ['}',''],
      ['',''],
      ['for (i in 3 downTo 1) println(i)      // 3 2 1','<code>downTo</code> cuenta hacia atrás.'],
      ['for (i in 1..7 step 2) println(i)     // 1 3 5 7','<code>step 2</code> salta de dos en dos. Ojo: <code>1..7</code> <b>incluye</b> el 7. Si no lo quieres, usa <code>1 until 7</code>.'],
      ['for (c in "kotlin") println(c)        // k o t l i n','Un String se puede recorrer letra a letra: <code>c</code> es cada <code>Char</code>.']
    ]}
  ]},
  {id:'k-fun', tag:'lee', title:'3. Funciones', blocks:[
    {t:'analogy', title:'Una función es una receta', html:'Le das ingredientes (<b>parámetros</b>), sigue unos pasos y te devuelve un plato (<b>valor de retorno</b>). En Kotlin se declara con <code>fun</code>. Si no devuelve nada, el tipo es <code>Unit</code> (el <code>void</code> de Java) y se puede omitir.'},
    {t:'code', file:'Funciones.kt', lines:[
      ['fun sumar(a: Int, b: Int): Int {','<code>fun</code> + nombre + (parámetros con su tipo) + <code>: TipoDeRetorno</code>.'],
      ['    return a + b',''],
      ['}',''],
      ['fun doble(n: Int) = n * 2','Versión corta: si la función es una sola expresión, usa <code>=</code> y Kotlin deduce el tipo de retorno.'],
      ['fun saludar(nombre: String = "amigo"): Unit {','<b>Parámetro por defecto</b>: si al llamar no pasas <code>nombre</code>, valdrá "amigo". <code>: Unit</code> = no devuelve nada (opcional escribirlo).'],
      ['    println("Hola $nombre")',''],
      ['}',''],
      ['',''],
      ['sumar(b = 2, a = 5)          // 7','<b>Argumentos con nombre</b>: al escribir <code>a =</code> y <code>b =</code> puedes cambiar el orden. Compose usa esto constantemente: <code>Text(text = ..., color = ...)</code>.'],
      ['saludar()                    // Hola amigo','Sin argumento → usa el valor por defecto.'],
      ['',''],
      ['val hola = { println("Hola") }','<b>Lambda</b>: una función sin nombre guardada en una variable. Se llama como una función: <code>hola()</code>.'],
      ['val triple: (Int) -> Int = { it * 3 }','Tipo de función: recibe un <code>Int</code> y devuelve un <code>Int</code>. Como solo hay <b>un</b> parámetro, lo llamamos <code>it</code> sin declararlo.'],
      ['val ref = ::sumar','<b>Referencia a función</b> con <code>::</code>. Ahora <code>ref(1, 2)</code> es lo mismo que <code>sumar(1, 2)</code>.']
    ]},
    {t:'p', html:'¿Por qué importan tanto las lambdas? Porque en Android los botones funcionan así: <code>Button(onClick = { contador++ })</code>. Lo que va entre llaves es una lambda: "lo que pasa cuando pulsan".'}
  ]},
  {id:'k-class', tag:'lee', title:'4. Clases y objetos', blocks:[
    {t:'analogy', title:'La clase es el molde, el objeto es la galleta', html:'Una <b>clase</b> describe cómo es algo (qué datos tiene y qué sabe hacer). Un <b>objeto</b> es una cosa concreta hecha con ese molde. En Kotlin las clases son públicas por defecto, heredan de <code>Any</code> y los objetos se crean <b>sin</b> <code>new</code>.'},
    {t:'code', file:'Clases.kt', lines:[
      ['open class Animal(val nombre: String) {','Entre paréntesis está el <b>constructor principal</b>. <code>val nombre</code> crea a la vez el parámetro y la propiedad. <code>open</code> = esta clase <b>se puede heredar</b> (por defecto no se puede).'],
      ['    open fun sonido() = "..."','<code>open</code> en un método = las clases hijas lo pueden sobrescribir.'],
      ['}',''],
      ['class Perro(nombre: String) : Animal(nombre) {','Herencia con <b>dos puntos</b> <code>:</code>. Perro pasa <code>nombre</code> al constructor de Animal.'],
      ['    override fun sonido() = "Guau"','<code>override</code> obligatorio al sobrescribir.'],
      ['}',''],
      ['',''],
      ['class Cuenta {',''],
      ['    var saldo: Int = 0','Kotlin crea el get y el set automáticamente; no los ves.'],
      ['        set(value) { field = if (value < 0) 0 else value }','Set personalizado: <code>value</code> es lo que intentan asignar, <code>field</code> es la variable interna real (campo de respaldo). Si es negativo, guardamos 0.'],
      ['}',''],
      ['',''],
      ['data class Pregunta(val texto: String, val respuesta: Boolean)','<b>data class</b>: solo guarda datos. Kotlin le regala <code>toString()</code>, <code>equals()</code> y <code>copy()</code>. La usarás muchísimo (Ud3 y Ud4).'],
      ['enum class Dificultad { FACIL, MEDIA, DIFICIL }','<b>enum</b>: un tipo con un número cerrado de valores posibles.'],
      ['object Ajustes { val version = 1 }','<b>object</b> = <b>singleton</b>: solo existe una instancia. Se usa como <code>Ajustes.version</code> (parecido a <code>static</code> en Java).'],
      ['',''],
      ['val toby = Perro("Toby")','Crear objeto: sin <code>new</code> y sin escribir el tipo.'],
      ['println(toby.sonido())        // Guau','']
    ]},
    {t:'table', head:['Modificador','Misma clase','Subclase','Mismo módulo','Fuera del módulo'], rows:[['private','✔','✘','✘','✘'],['protected','✔','✔','✘','✘'],['internal','✔','✔','✔','✘'],['public (por defecto)','✔','✔','✔','✔']]},
    {t:'p', html:'Otras dos ideas de las diapositivas: una clase implementa interfaces también con <code>:</code> separadas por comas (<code>class A : B(), Interfaz1, Interfaz2</code>), porque solo se puede heredar de <b>una</b> clase. Y la <b>delegación</b> con <code>by</code> permite que un objeto "preste" su implementación a otro sin heredar.'}
  ]},
  {id:'k-col', tag:'lee', title:'5. Colecciones', blocks:[
    {t:'code', file:'Colecciones.kt', lines:[
      ['val numeros = arrayOf(1, 2, 3)','<b>Array</b>: tamaño fijo. Se accede con <code>numeros[0]</code>.'],
      ['val frutas = listOf("pera", "kiwi")','<b>List</b>: ordenada y de <b>solo lectura</b>. No tiene <code>add</code>.'],
      ['val compra = mutableListOf("pan")','<b>MutableList</b>: se puede modificar.'],
      ['compra.add("leche")','Añade al final → [pan, leche]'],
      ['compra[0] = "agua"','Cambia la posición 0 → [agua, leche]'],
      ['compra.remove("leche")','Quita ese elemento → [agua]. Fíjate: <code>compra</code> es <code>val</code> y aun así la lista cambia. <code>val</code> impide cambiar <b>la caja</b>, no lo que hay dentro del objeto.'],
      ['println(compra.size)          // 1','<code>size</code> = tamaño. <code>indexOf("agua")</code> daría 0.'],
      ['',''],
      ['val colores = setOf("rojo", "rojo", "azul")','<b>Set</b> (conjunto): sin orden y <b>sin duplicados</b> → {rojo, azul}. No tiene índices.'],
      ['println("rojo" in colores)     // true','Comprobar si está con <code>in</code> o <code>contains</code>.'],
      ['',''],
      ['val edades = mutableMapOf("Ana" to 17, "Luis" to 18)','<b>Map</b>: pares clave → valor. <code>to</code> crea cada par. Las claves no se repiten.'],
      ['edades["Eva"] = 19','Añadir o cambiar con <code>[clave]</code> (o <code>put</code>).'],
      ['println(edades["Ana"])         // 17','Leer por clave.']
    ]}
  ]},
  {id:'k-null', tag:'lee', title:'6. Nulabilidad: el seguro anti-errores', blocks:[
    {t:'analogy', title:'null = caja vacía', html:'El error más famoso de Java es <code>NullPointerException</code>: intentas usar algo que no existe. Kotlin te obliga a <b>avisar</b> cuando una variable puede estar vacía, poniendo <code>?</code> detrás del tipo. Si no lo pones, la variable nunca podrá ser <code>null</code>.'},
    {t:'code', file:'Nulos.kt', lines:[
      ['var nombre: String = "Ana"','Tipo <b>no anulable</b>: nunca puede ser null.'],
      ['// nombre = null              ← ERROR de compilación','Kotlin no te deja.'],
      ['var apodo: String? = null','Tipo <b>anulable</b>: el <code>?</code> dice "puede estar vacío".'],
      ['println(apodo?.length)          // null','<b>Llamada segura</b> <code>?.</code>: si <code>apodo</code> es null, no peta, devuelve null.'],
      ['println(apodo?.length ?: 0)     // 0','<b>Operador Elvis</b> <code>?:</code>: "si lo de la izquierda es null, usa esto otro". Lo verás en la Ud4: <code>toIntOrNull() ?: 0</code>.'],
      ['println(apodo!!.length)         // 💥 NullPointerException','<b>!!</b> = "te juro que no es null". Si te equivocas, la app se cierra. Evítalo.']
    ]}
  ]},
  {id:'k-lab', tag:'toca', title:'Laboratorio: ¿compila o no compila?', blocks:[{t:'lab', id:'compila'}]},
  {id:'k-err', tag:'lee', title:'Errores típicos', blocks:[{t:'mistakes', items:[
    ['Reasignar un val','Si necesitas cambiar el valor, declara la variable con <code>var</code>.'],
    ['Olvidar el else en un when que devuelve valor','<code>val x = when(n) { 1 -> "uno" }</code> no compila. Añade <code>else -> ...</code>.'],
    ['Escribir new','En Kotlin se crea así: <code>val p = Persona()</code>.'],
    ['Heredar de una clase que no es open','Las clases son <i>final</i> por defecto. Añade <code>open</code> a la clase padre (y a los métodos que quieras sobrescribir).'],
    ['add sobre listOf','<code>listOf</code> es de solo lectura. Usa <code>mutableListOf</code>.'],
    ['Abusar de !!','Usa <code>?.</code> y <code>?:</code>. Cada <code>!!</code> es un posible cierre de la app.']
  ]}]},
  {id:'k-quiz', tag:'comprueba', title:'Comprueba lo que sabes', blocks:[{t:'quiz'}]},
  {id:'k-prac', tag:'toca', title:'Practica: rellena los huecos', blocks:[{t:'practice'}]},
  {id:'k-check', tag:'comprueba', title:'Ya sé…', blocks:[{t:'check'}]}
 ],
 quiz:[
  {q:'¿Qué palabra usas para una variable cuyo valor <b>no</b> cambiará?', o:['var','val','const var','let'], a:1, w:'<code>val</code> = solo lectura. <code>var</code> = mutable.'},
  {q:'¿Qué imprime <code>for (i in 1..7 step 2) print(i)</code>?', o:['1234567','1357','246','135'], a:1, w:'<code>1..7</code> incluye el 7 y <code>step 2</code> salta de dos en dos: 1, 3, 5, 7.'},
  {q:'¿Qué sustituye en Kotlin al <code>switch</code> de Java?', o:['select','case','when','match'], a:2, w:'<code>when</code>, que además puede devolver un valor.'},
  {q:'¿Cuál es el equivalente de <code>void</code> en Kotlin?', o:['Nothing','Null','Any','Unit'], a:3, w:'<code>Unit</code>. <code>Any</code> es la clase padre de todas (como <code>Object</code>).'},
  {q:'En una lambda con un único parámetro, ¿cómo lo nombras sin declararlo?', o:['this','it','self','value'], a:1, w:'<code>it</code>, por ejemplo <code>{ it * 2 }</code>.'},
  {q:'Para poder heredar de una clase, la clase padre debe ser…', o:['public','abstract obligatoriamente','open','data'], a:2, w:'Por defecto las clases no se pueden heredar. <code>open</code> lo permite.'},
  {q:'¿Qué hace una <code>data class</code>?', o:['Guarda datos y genera automáticamente toString, equals y copy','Conecta con una base de datos','Solo puede tener funciones','Es un singleton'], a:0, w:'Es una clase pensada solo para datos. <code>copy()</code> será clave en la Ud4.'},
  {q:'¿Qué palabra crea un <b>singleton</b>?', o:['static','single','object','companion'], a:2, w:'<code>object Nombre { ... }</code> crea una única instancia.'},
  {q:'<code>val l = listOf(1, 2)</code>. ¿Qué pasa con <code>l.add(3)</code>?', o:['Añade el 3','No compila: List es de solo lectura','Lanza NullPointerException','Sustituye el 2'], a:1, w:'Para añadir hace falta <code>mutableListOf</code>.'},
  {q:'<code>var a: String? = null</code>. ¿Qué devuelve <code>a?.length ?: 0</code>?', o:['null','Error de compilación','0','NullPointerException'], a:2, w:'<code>?.</code> devuelve null sin fallar y <code>?:</code> lo cambia por 0.'},
  {q:'¿Qué colección <b>no</b> permite duplicados?', o:['List','Array','Set','MutableList'], a:2, w:'Set (conjunto): sin orden y sin repetidos.'}
 ],
 practice:[
  {p:'Declara una constante con tu nombre que nunca va a cambiar.', code:'{{0}} nombre = "Ana"', a:[['val']], h:'Caja sellada.'},
  {p:'Recorre los números impares del 1 al 9.', code:'for (i in 1..9 {{0}} 2) {\n    println(i)\n}', a:[['step']], h:'"paso" en inglés.'},
  {p:'Completa la función para que devuelva un número entero.', code:'fun doble(n: Int): {{0}} {\n    {{1}} n * 2\n}', a:[['Int'],['return']], h:'Tipo entero + palabra para devolver.'},
  {p:'Haz que <code>apodo</code> pueda ser null y muestra 0 si lo es.', code:'var apodo: String{{0}} = null\nprintln(apodo{{1}}length {{2}} 0)', a:[['?'],['?.'],['?:']], h:'Anulable, llamada segura, Elvis.'},
  {p:'Gato hereda de Animal.', code:'{{0}} class Animal(val nombre: String)\nclass Gato(nombre: String) {{1}} Animal(nombre)', a:[['open'],[':']], h:'La clase padre tiene que permitirlo.'},
  {p:'Crea una lista a la que se le pueda añadir elementos.', code:'val compra = {{0}}("pan")\ncompra.{{1}}("leche")', a:[['mutableListOf'],['add']], h:'mutable…'}
 ],
 check:['Sé cuándo usar val y cuándo var.','Sé escribir un when con else y un for con .., step y downTo.','Sé crear una función con parámetros por defecto y llamarla con nombres.','Entiendo qué es una lambda y qué significa it.','Sé crear una data class y un objeto sin new.','Distingo List, MutableList, Set y Map.','Sé usar ?, ?. y ?: y por qué evitar !!.']
},
/* ---------------------------------------------------------------- UD1 */
{
 id:'ud1', num:'1', title:'Introducción a Android', short:'Arquitectura y Android Studio', minutes:'4–6 h', color:'a',
 intro:'En esta unidad conoces "la casa": cómo está organizado Android por dentro, qué piezas forman una app y cómo usar Android Studio para crear, ejecutar y depurar un proyecto.',
 goals:['Explicar las 4 capas de la arquitectura de Android.','Nombrar los 4 componentes de una aplicación y qué es una Actividad.','Leer un AndroidManifest.xml y localizar la Actividad LAUNCHER.','Crear un proyecto con un nombre de paquete correcto.','Saber para qué sirve cada fichero del proyecto.','Ejecutar en emulador o móvil, importar desde GitHub, usar Gradle, el Debugger y Logcat.'],
 sections:[
  {id:'u1-arq', tag:'lee', title:'1. Arquitectura: un edificio por capas', blocks:[
    {t:'analogy', title:'Como un edificio', html:'Abajo están los <b>cimientos</b> (el hardware: cámara, wifi, pantalla). Encima, las <b>instalaciones</b> (el sistema operativo). Luego, los <b>servicios comunes</b> del edificio (el Framework: clases ya hechas que puedes usar). Arriba del todo, <b>los pisos</b> donde vive la gente (las aplicaciones). Tú, como programador, trabajas en los pisos y usas los servicios del Framework sin tocar los cimientos.'},
    {t:'p', html:'Cada capa resuelve una parte pequeña del problema. Las de abajo resuelven problemas pequeños y concretos; combinadas, dan la funcionalidad completa. Desde tu app nunca hablas con el hardware directamente: pides las cosas al Framework.'},
    {t:'lab', id:'capas'}
  ]},
  {id:'u1-app', tag:'lee', title:'2. ¿De qué está hecha una aplicación?', blocks:[
    {t:'p', html:'Una aplicación Android es una <b>colección de componentes</b> que trabajan juntos usando el Framework. Hay 4 tipos. En el curso nos centramos en el primero.'},
    {t:'table', head:['Componente','Qué es','Ejemplo de la vida real'], rows:[['<b>Actividad</b> (Activity)','Una pantalla con la que el usuario interactúa','La pantalla para escribir un correo'],['Servicio (Service)','Trabajo en segundo plano, sin pantalla','La música que sigue sonando con el móvil bloqueado'],['Content Provider','Comparte datos con otras apps','Los contactos que WhatsApp puede leer'],['Broadcast Receiver','Escucha avisos del sistema','Reaccionar a "batería baja"']]},
    {t:'p', html:'Una <b>Actividad</b> crea la ventana donde la app dibuja y recibe los eventos (toques, teclado…). Una app típica tiene varias actividades y una de ellas es la primera en abrirse al pulsar el icono: la <b>launcher</b>. ¿Cómo sabe Android cuál es? Por el <b>AndroidManifest.xml</b>, donde se registra cada componente.'}
  ]},
  {id:'u1-man', tag:'mira', title:'3. AndroidManifest.xml línea a línea', blocks:[
    {t:'p', html:'Pulsa cualquier línea con número naranja para ver qué significa.'},
    {t:'code', file:'AndroidManifest.xml', lang:'xml', lines:[
      ['<manifest xmlns:android="http://schemas.android.com/apk/res/android">','La etiqueta raíz. Todo el fichero describe <b>tu app</b> ante el sistema.'],
      ['    <application','Características generales de la aplicación.'],
      ['        android:icon="@mipmap/ic_launcher"','El icono, guardado en la carpeta <code>res/mipmap</code>.'],
      ['        android:label="@string/app_name"','El nombre de la app, tomado de <code>strings.xml</code> (no escrito a mano).'],
      ['        android:theme="@style/Theme.MiApp">','El tema visual, definido en <code>themes.xml</code>.'],
      ['        <activity','Aquí se registra <b>un componente Actividad</b>. Si una Actividad no está en el Manifest, Android no la conoce.'],
      ['            android:name=".MainActivity"','La clase Kotlin de esta actividad. El punto inicial significa "dentro de mi paquete".'],
      ['            android:exported="true">','Puede ser abierta desde fuera de la app (el lanzador del móvil la abre).'],
      ['            <intent-filter>','Dice <b>cuándo</b> se puede abrir esta actividad.'],
      ['                <action android:name="android.intent.action.MAIN" />','Es el <b>punto de entrada principal</b> de la app.'],
      ['                <category android:name="android.intent.category.LAUNCHER" />','<b>La clave del examen</b>: LAUNCHER = aparece en el menú de apps y es la que se abre al pulsar el icono.'],
      ['            </intent-filter>',''],
      ['        </activity>',''],
      ['    </application>',''],
      ['</manifest>','']
    ]},
    {t:'p', html:'Resumen para memorizar: <b>application → activity → intent-filter → category LAUNCHER</b>.'}
  ]},
  {id:'u1-studio', tag:'lee', title:'4. Android Studio: crear un proyecto', blocks:[
    {t:'p', html:'Android Studio es el IDE oficial (como Eclipse o IntelliJ, pero para Android). Trae editor, emulador, depurador y herramientas de prueba. Descarga: <a href="https://developer.android.com/studio" target="_blank" rel="noopener">developer.android.com/studio</a>.'},
    {t:'steps', items:[
      '<b>New Project</b>: desde la pantalla de bienvenida, o con un proyecto abierto en <i>File › New › New Project</i>.',
      'Elige la plantilla <b>Empty Activity</b> (la de Jetpack Compose).',
      '<b>Name</b>: el nombre visible de la app (puede tener espacios).',
      '<b>Package name</b>: identificador único. Dominio al revés + nombre de la app sin espacios: <code>com.carlosc.apptest</code>. Debe ser único si la subes a Google Play.',
      '<b>Save location</b>: la carpeta donde se guarda.',
      '<b>Minimum SDK</b>: la versión de Android más antigua que soportará. Más baja = más móviles compatibles, pero menos funciones nuevas.',
      '<b>Lenguaje / build</b>: Kotlin y Kotlin DSL (<code>build.gradle.kts</code>). Pulsa <b>Finish</b> y espera a que Gradle termine (barra de abajo).'
    ]},
    {t:'p', html:'Truco: desde la interfaz puedes cambiar el tema del IDE (claro / oscuro) en <i>Settings › Appearance</i>. No cae en examen, pero cansa menos la vista.'}
  ]},
  {id:'u1-files', tag:'toca', title:'5. Explora los ficheros del proyecto', blocks:[
    {t:'p', html:'Este es el árbol que ves en la vista <b>Android</b> del panel Project. Pulsa cada fichero para saber qué contiene.'},
    {t:'lab', id:'ficheros'}
  ]},
  {id:'u1-run', tag:'lee', title:'6. Ejecutar la app', blocks:[
    {t:'p', html:'Dos formas, y en ambas pulsas el botón verde ▶ <b>Run</b>:'},
    {t:'table', head:['En tu móvil','En el emulador (AVD)'], rows:[[
      '<ol><li>Ajustes › Información del teléfono › pulsa <b>7 veces</b> en <i>Número de compilación</i>.</li><li>Entra en <b>Opciones del programador</b> y activa <b>Depuración por USB</b>.</li><li>Conecta el cable USB.</li><li>En Windows quizá necesites el driver USB del fabricante (ADB interface).</li></ol>',
      '<ol><li><b>Device Manager</b> › <i>Add a new device › Create Virtual Device</i>.</li><li>Elige el dispositivo (p. ej. Pixel).</li><li>Descarga la imagen del sistema.</li><li><i>Next › Finish</i>.</li><li>Si va lento o no arranca: activa la <b>virtualización (VT-x)</b> en la BIOS y revisa el acelerador en <i>Tools › SDK Manager</i>.</li></ol>'
    ]]},
    {t:'p', html:'AVD = <i>Android Virtual Device</i>: un móvil simulado dentro de tu ordenador. Sirve para probar sin tener un móvil real, y también simula tablets, Wear OS y Android TV.'}
  ]},
  {id:'u1-git', tag:'lee', title:'7. Importar desde GitHub y Gradle', blocks:[
    {t:'steps', items:['En GitHub: <b>Code › Download ZIP</b>.','Descomprime el ZIP.','En Android Studio: <b>File › Open</b> y selecciona la carpeta descomprimida (la que contiene <code>settings.gradle.kts</code>).']},
    {t:'analogy', title:'Gradle es el jefe de obra', html:'Coge tu código, las librerías y los recursos y los "construye" en una app instalable (APK). Si al importar un proyecto aparecen errores de versión de SDK, se arreglan en dos ficheros: <code>libs.versions.toml</code> (el catálogo de versiones) y <code>build.gradle.kts (Module :app)</code> (qué usa tu app). Después pulsa <b>Sync Now</b>.'},
    {t:'code', file:'build.gradle.kts (Module :app)', lines:[
      ['android {',''],
      ['    compileSdk = 35','Versión del SDK con la que se compila. Si el proyecto importado pide una que no tienes, súbela aquí.'],
      ['    defaultConfig {',''],
      ['        applicationId = "com.carlosc.apptest"','El nombre de paquete único de la app.'],
      ['        minSdk = 24','La versión mínima de Android compatible.'],
      ['        targetSdk = 35',''],
      ['    }',''],
      ['}',''],
      ['dependencies {','Las librerías que usa la app.'],
      ['    implementation(libs.androidx.core.ktx)','<code>libs.xxx</code> apunta a una entrada de <code>libs.versions.toml</code>. Así las versiones están en un único sitio.'],
      ['}','']
    ]}
  ]},
  {id:'u1-debug', tag:'toca', title:'8. Debugger y Logcat', blocks:[
    {t:'p', html:'<b>Debugger</b>: haz clic junto al número de línea para poner un <b>punto de interrupción</b> (punto rojo). Ejecuta con el icono del <b>bicho</b> 🐞 (Debug) en lugar de ▶. La app se parará en esa línea y podrás ver el valor de cada variable en la consola de debug.'},
    {t:'p', html:'<b>Logcat</b>: es la consola donde aparecen los mensajes que tu app escribe con la clase <code>Log</code>. Hay 5 niveles: <code>Log.e</code> (error), <code>Log.w</code> (warning), <code>Log.i</code> (info), <code>Log.d</code> (debug), <code>Log.v</code> (verbose). Truco para recordarlos: <b>E-W-I-D-V</b> de más grave a menos.'},
    {t:'lab', id:'logcat'},
    {t:'p', html:'Cuando el problema esté resuelto, <b>quita los Log</b>: la memoria que los guarda es limitada y, si hay demasiados, un mensaje importante puede desaparecer enseguida.'}
  ]},
  {id:'u1-err', tag:'lee', title:'Errores típicos', blocks:[{t:'mistakes', items:[
    ['El emulador no arranca o va muy lento','Activa VT-x/virtualización en la BIOS y revisa el acelerador en SDK Manager.'],
    ['El móvil no aparece en Android Studio','¿Activaste Depuración por USB? ¿Aceptaste el aviso "Permitir depuración" en el móvil? En Windows, revisa el driver.'],
    ['Errores al importar un proyecto','Ajusta versiones en <code>libs.versions.toml</code> y <code>build.gradle.kts (Module :app)</code>, no en el de Project, y pulsa Sync.'],
    ['Paquete con espacios o mayúsculas raras','Usa minúsculas y sin espacios: <code>com.tunombre.miapp</code>.'],
    ['La app abre otra pantalla o ninguna','Mira qué actividad tiene <code>category.LAUNCHER</code> en el Manifest.']
  ]}]},
  {id:'u1-quiz', tag:'comprueba', title:'Comprueba lo que sabes', blocks:[{t:'quiz'}]},
  {id:'u1-prac', tag:'toca', title:'Practica', blocks:[{t:'practice'}]},
  {id:'u1-check', tag:'comprueba', title:'Ya sé…', blocks:[{t:'check'}]}

 quiz:[
  {q:'Ordena de abajo arriba la arquitectura de Android. ¿Cuál es la capa <b>más baja</b>?', o:['Framework','Aplicaciones','Hardware del dispositivo','Sistema operativo'], a:2, w:'Hardware → Sistema operativo → Framework → Aplicaciones.'},
  {q:'¿Cuál <b>no</b> es uno de los 4 componentes de una app Android?', o:['Activity','Service','Fragment','Broadcast Receiver'], a:2, w:'Los 4 son Actividades, Servicios, Content Providers y Broadcast Receivers.'},
  {q:'¿Qué componente se encarga de casi toda la interacción con el usuario (una pantalla)?', o:['Service','Activity','Content Provider','Gradle'], a:1, w:'La Actividad crea la ventana y recibe los eventos.'},
  {q:'¿Dónde se registran los componentes de la app?', o:['build.gradle.kts','strings.xml','AndroidManifest.xml','MainActivity.kt'], a:2, w:'Android conoce los componentes porque están en el Manifest.'},
  {q:'¿Qué indica que una actividad es la que se abre al pulsar el icono?', o:['category LAUNCHER dentro de intent-filter','android:exported="false"','La etiqueta <service>','El nombre MainActivity'], a:0, w:'<code>&lt;category android:name="android.intent.category.LAUNCHER"/&gt;</code>.'},
  {q:'¿Cuál es un nombre de paquete correcto?', o:['Mi App','com.carlosc.apptest','apptest.com','com carlosc apptest'], a:1, w:'Dominio invertido + nombre de la app sin espacios.'},
  {q:'¿Para qué se pulsa 7 veces en "Número de compilación"?', o:['Para borrar la caché','Para activar las Opciones del programador','Para actualizar Android','Para instalar el driver'], a:1, w:'Después activas la Depuración por USB.'},
  {q:'¿Qué es un AVD?', o:['Un tipo de Actividad','Un dispositivo virtual del emulador','Una librería de Gradle','Un fichero de recursos'], a:1, w:'Android Virtual Device.'},
  {q:'¿En qué fichero están los textos de la app?', o:['colors.xml','themes.xml','strings.xml','AndroidManifest.xml'], a:2, w:'strings.xml, en res/values.'},
  {q:'¿Qué hace Gradle?', o:['Diseña la interfaz','Construye (compila y empaqueta) la app y gestiona dependencias','Es el emulador','Es el depurador'], a:1, w:'Es el sistema automatizado de construcción.'},
  {q:'¿Qué método de Log usarías para un <b>error</b>?', o:['Log.d','Log.i','Log.e','Log.v'], a:2, w:'e = error, w = warning, i = info, d = debug, v = verbose.'},
  {q:'¿Por qué hay que quitar los Log al terminar?', o:['Porque ralentizan la compilación','Porque la pila que los guarda es limitada y se pierden mensajes importantes','Porque Google Play los prohíbe','Porque cambian el diseño'], a:1, w:'Exactamente lo que dicen las diapositivas.'}

{
 id:'ud2', num:'2', title:'Diseño de interfaces', short:'Jetpack Compose', minutes:'8–10 h', color:'a',
 intro:'Ahora construyes pantallas. Con Jetpack Compose no "dibujas" botones con el ratón: escribes funciones Kotlin que <b>describen</b> lo que debe verse. Esta es la unidad más práctica y la que más pesa.',
 goals:['Explicar qué es una función @Composable y sus reglas.','Entender el MainActivity que crea Android Studio.','Mostrar textos con estilo y sin escribirlos a mano (stringResource).','Pedir texto al usuario con TextField.','Mostrar imágenes y usar Scaffold.','Organizar elementos con Column, Row y Box y modificadores.','Crear botones, hacer un mockup y traducir la app.'],
 sections:[
  {id:'u2-comp', tag:'lee', title:'1. Jetpack Compose y @Composable', blocks:[
    {t:'analogy', title:'Describes, no dibujas', html:'Imagina que encargas una pizza: no dices "mueve la mano, coge la masa…", dices "quiero una pizza con queso y champiñones". Compose funciona igual: tú describes <b>qué</b> quieres ver (un texto, debajo un botón) y Compose se encarga de dibujarlo, y de <b>redibujarlo</b> solo cuando cambian los datos.'},
    {t:'p', html:'Las piezas de Compose son <b>funciones de componibilidad</b>. Reglas:'},
    {t:'steps', items:['Llevan la anotación <code>@Composable</code> encima. (Una anotación es una "etiqueta" con <code>@</code> que da información extra al compilador, como <code>@Preview</code>.)','<b>No devuelven nada</b>: describen un trozo de interfaz.','Su nombre empieza por <b>mayúscula</b> y es un <b>sustantivo</b>: <code>PerfilUsuario</code> ✔, <code>DibujarPerfilUsuario</code> ✘ (verbo), <code>Brillante</code> ✘ (adjetivo), <code>Fuera</code> ✘ (adverbio).']}
  ]},
  {id:'u2-main', tag:'mira', title:'2. El MainActivity que genera Android Studio', blocks:[
    {t:'p', html:'Es el primer código que verás en cada proyecto. Pulsa cada línea marcada.'},
    {t:'code', file:'MainActivity.kt', lines:[
      ['class MainActivity : ComponentActivity() {','Nuestra Actividad (la pantalla) hereda de <code>ComponentActivity</code>.'],
      ['    override fun onCreate(savedInstanceState: Bundle?) {','<code>onCreate</code> se ejecuta cuando se crea la actividad. Lo verás a fondo en la Ud4 (ciclo de vida).'],
      ['        super.onCreate(savedInstanceState)',''],
      ['        enableEdgeToEdge()','La app ocupa toda la pantalla, también detrás de la barra de estado.'],
      ['        setContent {','<b>setContent</b> define el diseño de la actividad. Aquí dentro se llaman las funciones composables.'],
      ['            MyApplicationTheme {','Aplica el tema de la app (colores, tipografía, formas). Está en <code>ui.theme/Theme.kt</code>.'],
      ['                Scaffold(modifier = Modifier.fillMaxSize()) { innerPadding ->','<b>Scaffold</b> = "andamio", un contenedor con huecos para barras y botón flotante. <code>fillMaxSize()</code> = ocupa toda la pantalla. <code>innerPadding</code> es el margen para no quedar debajo de las barras.'],
      ['                    Greeting(','Llamamos a nuestra función composable…'],
      ['                        name = "Android",','…pasándole el texto…'],
      ['                        modifier = Modifier.padding(innerPadding)','…y un <b>modificador</b>: indica cómo debe aparecer o comportarse el elemento dentro del contenedor.'],
      ['                    )',''],
      ['                }',''],
      ['            }',''],
      ['        }',''],
      ['    }',''],
      ['}',''],
      ['',''],
      ['@Composable','Esta función describe interfaz.'],
      ['fun Greeting(name: String, modifier: Modifier = Modifier) {','Recibe un String y un modificador con valor por defecto (¿te suena? parámetro por defecto de Kotlin).'],
      ['    Text(text = "Hello $name!", modifier = modifier)','<code>Text</code> muestra un texto. Usa el String recibido y le aplica el modificador.'],
      ['}',''],
      ['',''],
      ['@Preview(showBackground = true)','<b>Vista previa</b>: permite ver el diseño en el panel <i>Split/Design</i> sin ejecutar la app.'],
      ['@Composable',''],
      ['fun GreetingPreview() {',''],
      ['    MyApplicationTheme { Greeting("Android") }','La preview también usa el tema de la app.'],
      ['}','']
    ]}
  ]},
  {id:'u2-text', tag:'mira', title:'3. Text: textos con estilo', blocks:[
    {t:'p', html:'<code>Text("Hola")</code> funciona, pero <b>no es lo recomendable</b>: un texto escrito a mano no se puede traducir. Los textos van en <code>res/values/strings.xml</code> y se leen con <code>stringResource</code>. Atajo: pon el cursor sobre el texto, pulsa la bombilla 💡 › <b>Extract string resource</b>.'},
    {t:'code', file:'strings.xml', lang:'xml', lines:[
      ['<resources>',''],
      ['    <string name="app_name">Saludos</string>',''],
      ['    <string name="saludo">¡Hola, mundo!</string>','El <code>name</code> es el identificador; en Kotlin será <code>R.string.saludo</code>.'],
      ['</resources>','']
    ]},
    {t:'code', file:'Saludo.kt', lines:[
      ['@Composable',''],
      ['fun Saludo(modifier: Modifier = Modifier) {',''],
      ['    Text(',''],
      ['        text = stringResource(R.string.saludo),','Lee el texto de strings.xml. <b>R</b> es una clase generada automáticamente con los ids de todos los recursos.'],
      ['        color = MaterialTheme.colorScheme.primary,','<b>Color</b>. Opciones: <code>Color.Red</code>, <code>Color(0xFF1D7348)</code>, <code>colorResource(R.color.x)</code> de colors.xml, colores de <code>Color.kt</code>, o (recomendado) los del <b>tema</b> como aquí.'],
      ['        fontSize = 24.sp,','<b>Tamaño</b> en <b>sp</b> (scalable pixels): respeta el tamaño de letra que el usuario elija en su móvil. <code>.sp</code> es una propiedad de extensión.'],
      ['        fontStyle = FontStyle.Italic,','Cursiva.'],
      ['        fontWeight = FontWeight.Bold,','Negrita.'],
      ['        textAlign = TextAlign.Start,','<b>Alineación</b>. Usa <b>Start/End</b>, no Left/Right: Start es la izquierda en español pero la derecha en árabe. Se adapta al idioma.'],
      ['        lineHeight = 32.sp,','Altura de la línea (también en sp; se puede usar <code>em</code>).'],
      ['        modifier = modifier','Pasa siempre el modificador.'],
      ['    )',''],
      ['}','']
    ]}
  ]},
  {id:'u2-tf', tag:'mira', title:'4. TextField: que el usuario escriba', blocks:[
    {t:'analogy', title:'El TextField no tiene memoria propia', html:'Un TextField muestra lo que tú le digas en <code>value</code>. Cuando el usuario teclea, te avisa en <code>onValueChange</code> con el texto nuevo, y <b>tú</b> lo guardas. Si no lo guardas, parece que el teclado no funciona. Para guardarlo usamos <code>remember { mutableStateOf("") }</code>: una variable que Compose recuerda y que, al cambiar, redibuja la pantalla.'},
    {t:'code', file:'Formulario.kt', lines:[
      ['@Composable',''],
      ['fun Formulario(modifier: Modifier = Modifier) {',''],
      ['    var nombre by remember { mutableStateOf("") }','<b>Estado</b>: <code>nombre</code> empieza vacío. <code>remember</code> hace que no se pierda al redibujar.'],
      ['    TextField(','Versión rellena (por defecto). Para la de contorno: <code>OutlinedTextField</code>, se usa igual.'],
      ['        value = nombre,','<b>value</b>: lo que se muestra.'],
      ['        onValueChange = { nombre = it },','<b>onValueChange</b>: lambda que recibe el texto nuevo (<code>it</code>) y lo guardamos.'],
      ['        label = { Text(stringResource(R.string.tu_nombre)) },','<b>label</b>: texto de ayuda dentro del campo.'],
      ['        singleLine = true,','Una sola línea (también existe <code>maxLines = 3</code>).'],
      ['        keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Text),','Qué teclado sale. Para números: <code>KeyboardType.Number</code>.'],
      ['        modifier = modifier',''],
      ['    )',''],
      ['}','']
    ]}
  ]},
  {id:'u2-img', tag:'mira', title:'5. Imágenes y Scaffold', blocks:[
    {t:'steps', items:['Abre <b>Resource Manager</b> (pestaña bajo Project, o <i>View › Tool Windows › Resource Manager</i>).','<b>+ › Import Drawables</b> y elige la imagen.','En QUALIFIER TYPE elige <b>Density</b> y en VALUE <b>No Density</b>. Así Android no la escala (si no, puede verse borrosa o gastar mucha memoria). <i>Next › Import</i>.']},
    {t:'code', file:'Fondo.kt', lines:[
      ['Image(',''],
      ['    painter = painterResource(R.drawable.img_fondo),','<b>painter</b>: la imagen a dibujar, sacada de <code>res/drawable</code> mediante la clase <b>R</b>.'],
      ['    contentDescription = null,','Descripción para lectores de pantalla (accesibilidad). <code>null</code> solo si es decorativa; si informa de algo, pon un <code>stringResource</code>.'],
      ['    contentScale = ContentScale.Crop,','Cómo se escala (Crop recorta para llenar, Fit cabe entera…).'],
      ['    alpha = 0.5f','Opacidad de 0 (invisible) a 1 (opaca). Fíjate en la <b>f</b>: es Float.'],
      [')','']
    ]},
    {t:'p', html:'<b>Scaffold</b> te da la estructura típica de una app de Material Design con tres huecos: <code>topBar</code> (barra superior), <code>bottomBar</code> (barra inferior) y <code>floatingActionButton</code> (botón redondo abajo a la derecha). El contenido recibe <code>innerPadding</code> para no quedar tapado.'}
  ]},
  {id:'u2-layout', tag:'toca', title:'6. Layouts: Column, Row y Box', blocks:[
    {t:'p', html:'Si pones varios elementos sin organizar, Compose los <b>apila uno encima de otro</b>. Para ordenarlos: <b>Column</b> (vertical, uno debajo de otro), <b>Row</b> (horizontal, uno al lado del otro) y <b>Box</b> (uno encima de otro, en capas). Se pueden anidar sin problema. Juega con el laboratorio y fíjate en cómo cambia el código.'},
    {t:'lab', id:'layout'},
    {t:'table', head:['Layout','Eje principal (Arrangement)','Eje cruzado (Alignment)'], rows:[['Column','verticalArrangement','horizontalAlignment'],['Row','horizontalArrangement','verticalAlignment'],['Box','—','contentAlignment']]},
    {t:'p', html:'Truco: <b>Arrangement</b> va en la misma dirección en la que se colocan los hijos; <b>Alignment</b> en la otra.'}
  ]},

{
 id:'ud3', num:'3', title:'Listas desplegables', short:'LazyColumn, grids y temas', minutes:'5–7 h', color:'a',
 intro:'Casi todas las apps muestran listas: contactos, mensajes, productos. Aquí aprendes a mostrar listas largas de forma eficiente, en cuadrícula, y a personalizar el aspecto con temas.',
 goals:['Explicar la diferencia entre Column y LazyColumn.','Construir una lista con data class + datos + LazyColumn + items.','Mostrar elementos en cuadrícula con LazyVerticalGrid (Fixed y Adaptive).','Cambiar colores, formas y tipografía del tema.'],
 sections:[
  {id:'u3-lazy', tag:'toca', title:'1. Column vs LazyColumn', blocks:[
    {t:'analogy', title:'El camarero perezoso (lazy)', html:'Un camarero normal (Column) saca <b>todos</b> los platos de la carta a la vez, aunque solo puedas comer uno. Un camarero "perezoso" (LazyColumn) solo trae los platos que <b>estás mirando</b> y, cuando bajas, retira los de arriba. Con 10 elementos da igual; con 1.000 la diferencia es enorme.'},
    {t:'p', html:'<b>Column/Row</b> son estáticos: cargan todos sus elementos a la vez y, para desplazarte, necesitas añadir scroll. <b>LazyColumn/LazyRow</b> crean los elementos según hacen falta y ya traen el desplazamiento incluido. Son la opción para listas largas. Añades un elemento con <code>item { }</code> o muchos con <code>items(lista) { }</code>.'},
    {t:'lab', id:'lazy'}
  ]},
  {id:'u3-ej', tag:'mira', title:'2. Ejemplo completo paso a paso: lista de banderas', blocks:[
    {t:'p', html:'Este es el ejemplo de clase. Sigue los 4 pasos en orden; es una receta que repetirás en cualquier lista.'},
    {t:'h4', html:'Paso 1 · Paquete <code>modelo</code> → data class con lo que tiene cada elemento'},
    {t:'code', file:'modelo/Bandera.kt', lines:[
      ['package com.example.ud3_ejemplo1.modelo','Creamos un paquete <b>modelo</b> para los datos (clic derecho en el paquete › New › Package).'],
      ['',''],
      ['data class Bandera(','Una <b>data class</b> (Kotlin, apartado 4): solo datos.'],
      ['    @StringRes val stringResourceId: Int,','El id del <b>nombre</b> del país en strings.xml. <code>@StringRes</code> indica que ese Int es un id de texto.'],
      ['    @DrawableRes val imagenResourceId: Int','El id de la <b>imagen</b> en drawable. <code>@DrawableRes</code> = id de imagen.'],
      [')','']
    ]},
    {t:'h4', html:'Paso 2 · Paquete <code>datos</code> → una clase que carga la lista'},
    {t:'code', file:'datos/Datos.kt', lines:[
      ['class Datos {',''],
      ['    fun cargarBanderas(): List<Bandera> = listOf(','Devuelve una <code>List</code> de banderas (colecciones, apartado 5).'],
      ['        Bandera(R.string.bandera1, R.drawable.bandera1),','Cada elemento: un id de texto y un id de imagen.'],
      ['        Bandera(R.string.bandera2, R.drawable.bandera2),',''],
      ['        Bandera(R.string.bandera3, R.drawable.bandera3)',''],
      ['    )',''],
      ['}','']
    ]},
    {t:'h4', html:'Paso 3 · Composable de la lista con LazyColumn'},
    {t:'code', file:'MainActivity.kt', lines:[
      ['@Composable',''],
      ['fun Ud3EjemploApp(modifier: Modifier = Modifier) {','La función "app" que llamamos desde setContent.'],
      ['    ListaBanderas(lista = Datos().cargarBanderas(), modifier = modifier)','Crea un objeto Datos (sin new), carga la lista y se la pasa a la función que la dibuja.'],
      ['}',''],
      ['',''],
      ['@Composable',''],
      ['fun ListaBanderas(lista: List<Bandera>, modifier: Modifier = Modifier) {',''],
      ['    LazyColumn(modifier = modifier) {','Lista vertical perezosa con scroll incluido.'],
      ['        items(lista) { bandera ->','<b>items</b> recorre la lista. Para cada elemento, <code>bandera</code> es el actual (como un for).'],
      ['            TarjetaBandera(bandera = bandera, modifier = Modifier.padding(8.dp))','Por cada bandera, dibuja una tarjeta con 8 dp de margen.'],
      ['        }',''],
      ['    }',''],
      ['}','']
    ]},
    {t:'h4', html:'Paso 4 · Composable de cada elemento (la tarjeta)'},
    {t:'code', file:'MainActivity.kt', lines:[
      ['@Composable',''],
      ['fun TarjetaBandera(bandera: Bandera, modifier: Modifier = Modifier) {',''],
      ['    Card(modifier = modifier) {','<b>Card</b>: tarjeta de Material con fondo y esquinas redondeadas.'],
      ['        Row(','Imagen y texto uno al lado del otro.'],
      ['            modifier = Modifier.fillMaxWidth(),','Ocupa todo el ancho.'],
      ['            verticalAlignment = Alignment.CenterVertically','Centrados en vertical (eje cruzado de Row).'],
      ['        ) {',''],
      ['            Image(',''],
      ['                painter = painterResource(bandera.imagenResourceId),','La imagen de <b>esta</b> bandera.'],
      ['                contentDescription = stringResource(bandera.stringResourceId)','Aquí la imagen sí informa, así que la describimos con el nombre del país.'],
      ['            )',''],
      ['            Text(',''],
      ['                text = stringResource(bandera.stringResourceId),',''],
      ['                modifier = Modifier.padding(16.dp),',''],
      ['                style = MaterialTheme.typography.headlineSmall','Estilo de texto del tema (tipografía, apartado 4).'],
      ['            )',''],
      ['        }',''],
      ['    }',''],
      ['}','']
    ]}
  ]},
  {id:'u3-grid', tag:'toca', title:'3. Grids (cuadrículas)', blocks:[
    {t:'p', html:'Igual que la lista, pero en cuadrícula: <b>LazyVerticalGrid</b> (scroll vertical, controlas las <code>columns</code>) o <b>LazyHorizontalGrid</b> (scroll horizontal, controlas las <code>rows</code>).'},
    {t:'table', head:['Función','Cuándo','Ejemplo'], rows:[['GridCells.Fixed(n)','Sabes exactamente cuántas columnas quieres','<code>GridCells.Fixed(2)</code> → siempre 2'],['GridCells.Adaptive(minSize)','No lo sabes: que quepan las que quepan con un tamaño mínimo','<code>GridCells.Adaptive(minSize = 128.dp)</code> → más columnas en tablet']]},
    {t:'lab', id:'grid'},
    {t:'code', file:'GridBanderas.kt', lines:[
      ['LazyVerticalGrid(',''],
      ['    columns = GridCells.Adaptive(minSize = 128.dp),','Cambia a <code>GridCells.Fixed(2)</code> para fijar dos columnas.'],
      ['    verticalArrangement = Arrangement.spacedBy(8.dp),','Separación de 8 dp entre filas.'],
      ['    horizontalArrangement = Arrangement.spacedBy(8.dp),','Separación entre columnas.'],
      ['    modifier = modifier',''],
      [') {',''],
      ['    items(lista) { bandera -> TarjetaBandera(bandera = bandera) }','Exactamente igual que en LazyColumn.'],
      ['}','']
    ]}
  ]},
  {id:'u3-tema', tag:'lee', title:'4. Temas: color, formas y tipografía', blocks:[
    {t:'p', html:'Material Design permite cambiar el aspecto de toda la app desde un sitio: <code>ui.theme/Theme.kt</code>. Ahí se juntan tres cosas:'},
    {t:'table', head:['Qué','Fichero','Ideas clave'], rows:[
      ['<b>Color</b>','ui.theme/Color.kt','<b>primary</b>: lo importante (barras, botones). <b>secondary</b>: lo menos importante (FAB). <b>tertiary</b>: equilibrar o llamar la atención (un campo). Puedes generar la paleta con <b>Material Theme Builder</b> y exportar <i>Jetpack Compose (Theme.kt)</i>: te da Theme.kt y Color.kt para sustituir los tuyos.'],
      ['<b>Shapes</b> (formas)','ui.theme/Shapes.kt (lo creas tú)','<code>RoundedCornerShape(16.dp)</code> redondea esquinas; o una a una con topStart, topEnd, bottomEnd, bottomStart. Ya hechas: <code>RectangleShape</code> y <code>CircleShape</code>.'],
      ['<b>Tipografía</b>','res/font + ui.theme/Type.kt','Clic derecho en res › Android Resource Directory › nombre y tipo <b>font</b>. Arrastra la fuente (nombre en minúsculas y con _ ). Declárala en Type.kt y úsala en la escala que quieras.']
    ]},
    {t:'code', file:'ui.theme/Shapes.kt', lines:[
      ['val Shapes = Shapes(','Una sola variable con los estilos de forma.'],
      ['    small = RoundedCornerShape(50.dp),','Muy redondeado (pastilla).'],
      ['    medium = RoundedCornerShape(bottomStart = 16.dp, topEnd = 16.dp)','Solo dos esquinas redondeadas.'],
      [')','Recuerda pasarla al tema: <code>MaterialTheme(colorScheme = ..., shapes = Shapes, typography = Typography)</code>.']
    ]},
    {t:'code', file:'ui.theme/Type.kt', lines:[
      ['val Montserrat = FontFamily(','Una familia con sus variantes, sacadas de <code>res/font</code>.'],
      ['    Font(R.font.montserrat_regular),',''],
      ['    Font(R.font.montserrat_bold, FontWeight.Bold)',''],
      [')',''],
      ['val Typography = Typography(',''],
      ['    displayLarge = TextStyle(fontFamily = Montserrat, fontWeight = FontWeight.Bold, fontSize = 36.sp),','Asignamos la fuente a una escala. Luego: <code>style = MaterialTheme.typography.displayLarge</code>.'],
      ['    bodyLarge = TextStyle(fontFamily = Montserrat, fontSize = 16.sp)',''],
      [')','']
    ]}
  ]},
  {id:'u3-err', tag:'lee', title:'Errores típicos', blocks:[{t:'mistakes', items:[
    ['Usar Column para una lista larga','Va lento y no hace scroll solo. Usa LazyColumn con items.'],

    ['Cambiar Color.kt y no ver cambios','Los colores tienen que estar usados en el colorScheme de Theme.kt.']
  ]}]},

{
 id:'ud4', num:'4', title:'Arquitectura', short:'Ciclo de vida y ViewModel', minutes:'8–10 h', color:'a',
 intro:'Hasta ahora tu app vivía en un mundo perfecto. Pero el usuario sale, recibe llamadas, gira el móvil… En esta unidad aprendes qué le pasa a tu Actividad en cada momento y cómo organizar la app para no perder datos.',
 goals:['Nombrar los estados y callbacks del ciclo de vida de una Actividad.','Predecir qué callbacks se ejecutan al salir, volver, girar o cerrar.','Explicar la separación en capas (IU, datos, dominio).','Explicar el flujo unidireccional IU ↔ ViewModel.','Programar un ViewModel con StateFlow, update y copy.'],
 sections:[
  {id:'u4-cv', tag:'lee', title:'1. Ciclo de vida de una Actividad', blocks:[
    {t:'analogy', title:'Como una serie que estás viendo', html:'Le das al play (<b>creada → iniciada → reanudada</b>). Te llaman y dejas la serie en segundo plano (<b>pausada → detenida</b>). Vuelves y sigue donde estaba (<b>reiniciada → iniciada → reanudada</b>). Si cierras la app o el móvil necesita memoria, la serie se <b>destruye</b>. Android hace esto para que la app que estás usando tenga recursos de sobra y vaya fluida.'},
    {t:'html', html:'<div class="states" aria-label="Estados"><span class="state">Created</span><span class="arrow">→</span><span class="state">Started</span><span class="arrow">→</span><span class="state on">Resumed</span><span class="arrow">→</span><span class="state">Paused</span><span class="arrow">→</span><span class="state">Stopped</span><span class="arrow">→</span><span class="state">Destroyed</span></div>'},
    {t:'table', head:['Callback','Se ejecuta cuando…','Uso típico'], rows:[
      ['<code>onCreate</code>','La actividad se crea (solo una vez por "vida")','Montar la interfaz con setContent'],

      ['    private val _operacionUIState = MutableStateFlow(OperacionUIState())','<b>MutableStateFlow</b>: el estado que <b>sí</b> se puede modificar. Es <code>private</code> y empieza con guion bajo: solo el ViewModel lo toca.'],
      ['    val operacionUIState: StateFlow<OperacionUIState> = _operacionUIState.asStateFlow()','Versión <b>de solo lectura</b> para la IU (<code>asStateFlow</code>). StateFlow es un flujo observable: emite el estado actual y cada cambio. Su <code>value</code> es el estado actual.'],
      ['',''],

      ['    var respuestaNumero2 by mutableStateOf("")',''],
      ['        private set',''],

      ['    fun actualizarNumero2(num: String) { /* igual que el anterior con numero2 */ }',''],

      ['        _operacionUIState.update { estadoActual ->',''],

      ['            val num2 = estadoActual.numero2.toIntOrNull() ?: 0',''],

function getU(id) { P[id] = P[id] || { check: {}, quiz: {}, prac: {} }; return P[id]; }

function unitPct(u) {
  const s = getU(u.id);
  const total = u.check.length + u.quiz.length + u.practice.length;
  const done = Object.values(s.check).filter(Boolean).length
    + Object.values(s.quiz).filter(v => v === true).length
    + Object.values(s.prac).filter(Boolean).length;
  return total ? Math.round(done / total * 100) : 0;
}

/* ---------- Resaltado de código ---------- */
const KW = new Set('val var fun class data object open override private public protected internal return if else when for in while is as null true false this super import package by interface enum set get field value it step downTo until const'.split(' '));
function hl(line, lang) {
  if (lang === 'xml') {
    return esc(line)
      .replace(/(&quot;[^&]*?&quot;)/g, '<span class="k-str">$1</span>')
      .replace(/(&lt;\/?[\w.:-]+|\/?&gt;)/g, '<span class="k-tag">$1</span>')
      .replace(/^(\s*)(\[[\w]+\])$/, '$1<span class="k-kw">$2</span>');
  }
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|(@\w+)|(\b\d+(?:\.\d+)?(?:f|L)?\b)|(\b[A-Za-z_]\w*\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += `<span class="k-com">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="k-str">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="k-ann">${esc(t)}</span>`;
    else if (m[4]) out += `<span class="k-num">${esc(t)}</span>`;
    else if (KW.has(t)) out += `<span class="k-kw">${t}</span>`;
    else if (/^[A-Z]/.test(t)) out += `<span class="k-type">${t}</span>`;
    else out += t;
    last = m.index + t.length;
  }
  return out + esc(line.slice(last));
}

let uid = 0;
function codeBox(b) {
  const id = 'cb' + (uid++);
  const hasEx = b.lines.some(l => l[1]);
  const lines = b.lines.map((l, i) =>
    `<div class="ln${l[1] ? ' x' : ''}" data-i="${i}" ${l[1] ? 'tabindex="0" role="button"' : ''}><span class="n">${i + 1}</span><span>${hl(l[0], b.lang) || ' '}</span></div>`).join('');
  setTimeout(() => {
    const box = document.getElementById(id); if (!box) return;
    const ex = $('.explain', box);
    const show = el => {
      $$('.ln.sel', box).forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      const i = +el.dataset.i;
      ex.innerHTML = `<b>Línea ${i + 1}</b>${b.lines[i][1]}`;
    };
    $$('.ln.x', box).forEach(el => {
      el.addEventListener('click', () => show(el));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(el); } });
    });
    const btn = $('.walk', box);
    if (btn) btn.addEventListener('click', () => {
      const xs = $$('.ln.x', box); const cur = xs.findIndex(x => x.classList.contains('sel'));
      const nx = xs[(cur + 1) % xs.length]; show(nx); nx.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
  });
  return `<div class="codebox" id="${id}"><div class="codebar"><span>${esc(b.file || '')}</span>${hasEx ? '<span class="row"><span class="hint">Pulsa una línea con número naranja</span><button class="walk" type="button">Siguiente línea ▸</button></span>' : ''}</div><div class="code">${lines}</div>${hasEx ? '<div class="explain">Elige una línea para ver su explicación, o pulsa <b>Siguiente línea</b> para recorrerlas en orden.</div>' : ''}</div>`;
}

function quizHTML(u) {
  const s = getU(u.id);
  const qs = u.quiz.map((q, i) => {
    const st = s.quiz[i];
    return `<div class="q" data-i="${i}"><div class="qt">${i + 1}. ${q.q}</div><div class="opts">${q.o.map((o, j) =>
      `<button type="button" class="opt" data-j="${j}"><span class="l">${'ABCD'[j]}</span><span>${o}</span></button>`).join('')}</div><div class="why" ${st === undefined ? 'hidden' : ''}></div></div>`;
  }).join('');
  return `<div class="quiz" data-u="${u.id}"><div class="row"><span class="score"></span><button type="button" class="btn sm reset-quiz">Repetir test</button></div>${qs}</div>`;
}
function bindQuiz(root, u) {
  const s = getU(u.id);
  const box = $('.quiz', root); if (!box) return;
  const score = () => {
    const ans = Object.keys(s.quiz).filter(k => k[0] !== 'a').length, ok = Object.values(s.quiz).filter(v => v === true).length;
    $('.score', box).textContent = `${ok} de ${u.quiz.length} correctas · ${ans} respondidas`;
  };
  const paint = (qEl, i, j) => {
    const q = u.quiz[i];
    $$('.opt', qEl).forEach((b, k) => { b.disabled = true; if (k === q.a) b.classList.add('right'); if (k === j && j !== q.a) b.classList.add('wrong'); });
    const w = $('.why', qEl); w.hidden = false;
    w.innerHTML = (j === q.a ? '<b class="ok">¡Correcto!</b> ' : '<b class="ko">No es esa.</b> ') + q.w;
  };
  $$('.q', box).forEach(qEl => {
    const i = +qEl.dataset.i;
    if (s.quiz[i] !== undefined) paint(qEl, i, s.quiz['a' + i]);
    $$('.opt', qEl).forEach(b => b.addEventListener('click', () => {
      const j = +b.dataset.j; s.quiz[i] = j === u.quiz[i].a; s.quiz['a' + i] = j; save(); paint(qEl, i, j); score();
    }));
  });
  $('.reset-quiz', box).addEventListener('click', () => { s.quiz = {}; save(); render(); setTimeout(() => $('[id$="-quiz"]')?.scrollIntoView(), 30); });
  score();
}
